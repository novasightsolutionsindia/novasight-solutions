<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - NovaSight Solutions</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Admin CSS -->
    <link rel="stylesheet" href="../css/admin.css">
    
    <style>
        /* Additional fix for login page */
        .login-body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(145deg, #0a2647 0%, #1e3a5f 100%);
            padding: 20px;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 50px 45px;
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            max-width: 460px;
            width: 100%;
        }
        .btn-block {
            width: 100%;
        }
    </style>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <img src="../images/logo.svg" alt="NovaSight" class="login-logo-img" onerror="this.style.display='none'">
                <span class="login-brand">NovaSight</span>
                <span class="login-brand-sub">ADMIN PANEL</span>
            </div>
            
            <form id="login-form" onsubmit="event.preventDefault(); return false;">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input type="text" id="username" name="username" class="form-control" 
                           placeholder="Enter username" required autofocus>
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="password" name="password" class="form-control" 
                           placeholder="Enter password" required>
                </div>
                
                <button type="submit" id="login-btn" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Login to Dashboard
                </button>
            </form>
            
            <div id="login-message" class="form-message" style="display: none;"></div>
            
            <div class="login-info">
                <p><i class="fas fa-info-circle"></i> Default Credentials:</p>
                <p><strong>Username:</strong> admin</p>
                <p><strong>Password:</strong> admin123</p>
            </div>
            
            <div class="login-footer">
                <a href="../index.html">
                    <i class="fas fa-arrow-left"></i> Back to Website
                </a>
            </div>
        </div>
    </div>
    
    <script>
        // DIRECT LOGIN SCRIPT - NO EXTERNAL DEPENDENCIES
        (function() {
            console.log('Login page loaded');
            
            // Wait for DOM to be ready
            document.addEventListener('DOMContentLoaded', function() {
                const loginForm = document.getElementById('login-form');
                const usernameInput = document.getElementById('username');
                const passwordInput = document.getElementById('password');
                const loginBtn = document.getElementById('login-btn');
                const messageEl = document.getElementById('login-message');
                
                // Check if already logged in
                if (localStorage.getItem('admin_logged_in') === 'true') {
                    console.log('Already logged in, redirecting...');
                    window.location.href = 'dashboard.html';
                    return;
                }
                
                // Handle form submission
                function handleLogin(e) {
                    if (e) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                    
                    console.log('Login attempt');
                    
                    const username = usernameInput ? usernameInput.value.trim() : '';
                    const password = passwordInput ? passwordInput.value : '';
                    
                    // Show loading state
                    if (loginBtn) {
                        loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
                        loginBtn.disabled = true;
                    }
                    
                    // Simple validation
                    if (!username || !password) {
                        showMessage('Please enter username and password', 'error');
                        resetButton();
                        return;
                    }
                    
                    // Check credentials
                    if (username === 'admin' && password === 'admin123') {
                        console.log('Login successful');
                        
                        // Set login data
                        localStorage.setItem('admin_logged_in', 'true');
                        localStorage.setItem('admin_name', username);
                        localStorage.setItem('admin_login_time', new Date().toISOString());
                        
                        showMessage('Login successful! Redirecting...', 'success');
                        
                        // Redirect to dashboard
                        setTimeout(function() {
                            window.location.href = 'dashboard.html';
                        }, 1000);
                    } else {
                        console.log('Login failed');
                        showMessage('Invalid username or password!', 'error');
                        resetButton();
                    }
                }
                
                function showMessage(text, type) {
                    if (messageEl) {
                        messageEl.textContent = text;
                        messageEl.className = 'form-message ' + type;
                        messageEl.style.display = 'block';
                        
                        // Hide message after 5 seconds
                        setTimeout(function() {
                            messageEl.style.display = 'none';
                        }, 5000);
                    } else {
                        alert(text);
                    }
                }
                
                function resetButton() {
                    if (loginBtn) {
                        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login to Dashboard';
                        loginBtn.disabled = false;
                    }
                }
                
                // Add event listeners
                if (loginForm) {
                    loginForm.addEventListener('submit', handleLogin);
                }
                
                if (loginBtn) {
                    loginBtn.addEventListener('click', handleLogin);
                }
                
                // Clear any existing login state on login page
                localStorage.removeItem('admin_logged_in');
                localStorage.removeItem('admin_name');
            });
        })();
    </script>
    
    <!-- Fallback to external JS but our inline script will work first -->
    <script src="../js/admin.js" defer></script>
</body>
</html>
