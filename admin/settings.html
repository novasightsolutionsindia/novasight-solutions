<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - NovaSight Admin</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Admin CSS -->
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="admin-wrapper">
        <!-- SIDEBAR -->
        <aside class="admin-sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <span class="logo-main">NovaSight</span>
                    <span class="logo-sub">ADMIN</span>
                </div>
                <button class="sidebar-toggle" id="sidebar-toggle">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="admin-profile">
                <div class="admin-avatar">
                    <i class="fas fa-user-shield"></i>
                </div>
                <div class="admin-info">
                    <h4 id="admin-name">Admin</h4>
                    <p>Administrator</p>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="dashboard.html">
                            <i class="fas fa-dashboard"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="services.html">
                            <i class="fas fa-camera"></i>
                            <span>Services</span>
                        </a>
                    </li>
                    <li>
                        <a href="customers.html">
                            <i class="fas fa-users"></i>
                            <span>Customers</span>
                        </a>
                    </li>
                    <li>
                        <a href="bookings.html">
                            <i class="fas fa-calendar"></i>
                            <span>Bookings</span>
                        </a>
                    </li>
                    <li class="active">
                        <a href="settings.html">
                            <i class="fas fa-gear"></i>
                            <span>Settings</span>
                        </a>
                    </li>
                    <li class="logout-item">
                        <a href="#" id="logout-btn">
                            <i class="fas fa-sign-out"></i>
                            <span>Logout</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>
        
        <!-- MAIN CONTENT -->
        <main class="admin-main">
            <!-- TOP BAR -->
            <div class="admin-topbar">
                <div class="topbar-left">
                    <button class="mobile-sidebar-toggle" id="mobile-sidebar-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="welcome-text">Business Settings</span>
                </div>
                
                <div class="topbar-right">
                    <a href="../index.html" target="_blank" class="topbar-link">
                        <i class="fas fa-external-link"></i>
                        <span>View Website</span>
                    </a>
                </div>
            </div>
            
            <!-- CONTENT AREA -->
            <div class="admin-content">
                <div class="page-header">
                    <h1 class="page-title">Business Settings</h1>
                </div>
                
                <!-- SETTINGS FORM -->
                <div class="form-section">
                    <h2>
                        <i class="fas fa-building"></i>
                        Business Information
                    </h2>
                    
                    <form id="settings-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="business_name">Business Name</label>
                                <input type="text" id="business_name" class="form-control" 
                                       value="NovaSight Solutions">
                            </div>
                            
                            <div class="form-group">
                                <label for="business_owner">Owner Name</label>
                                <input type="text" id="business_owner" class="form-control" 
                                       value="Sadeek Khan">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="business_address">Full Address</label>
                            <textarea id="business_address" class="form-control" rows="3">Karani Mandir Lane, Ward No. 60, Sureshiya, Hanumangarh Junction, Rajasthan -335512</textarea>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="business_mobile">Mobile Number</label>
                                <input type="text" id="business_mobile" class="form-control" 
                                       value="+91 77105 25823">
                            </div>
                            
                            <div class="form-group">
                                <label for="business_email">Email Address</label>
                                <input type="email" id="business_email" class="form-control" 
                                       value="novasightsolutionsindia@gmail.com">
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="business_latitude">Latitude</label>
                                <input type="text" id="business_latitude" class="form-control" 
                                       value="29.6345765">
                            </div>
                            
                            <div class="form-group">
                                <label for="business_longitude">Longitude</label>
                                <input type="text" id="business_longitude" class="form-control" 
                                       value="74.2944615">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="business_established">Established Year</label>
                            <input type="text" id="business_established" class="form-control" 
                                   value="2014">
                        </div>
                        
                        <h2 style="margin-top: 40px;">
                            <i class="fas fa-chart-line"></i>
                            Statistics
                        </h2>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="stats_rating">Google Rating</label>
                                <input type="text" id="stats_rating" class="form-control" value="4.9">
                            </div>
                            
                            <div class="form-group">
                                <label for="stats_reviews">Total Reviews</label>
                                <input type="text" id="stats_reviews" class="form-control" value="350">
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="stats_cameras">Cameras Installed</label>
                                <input type="text" id="stats_cameras" class="form-control" value="1500">
                            </div>
                            
                            <div class="form-group">
                                <label for="stats_clients">Total Clients</label>
                                <input type="text" id="stats_clients" class="form-control" value="220">
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="stats_happy_households">Happy Households</label>
                                <input type="text" id="stats_happy_households" class="form-control" value="520">
                            </div>
                            
                            <div class="form-group">
                                <label for="stats_business_clients">Business Clients</label>
                                <input type="text" id="stats_business_clients" class="form-control" value="180">
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Save All Settings
                            </button>
                            
                            <button type="button" class="btn btn-outline" id="reset-settings-btn">
                                <i class="fas fa-undo"></i> Reset to Default
                            </button>
                        </div>
                    </form>
                    
                    <div id="settings-message" class="form-message"></div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="../js/admin.js"></script>
</body>
</html>
